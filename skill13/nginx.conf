# =============================================
# Nginx Configuration - Skill 13 Deployment
# KL University FSAD
# =============================================
# Place this file at: /etc/nginx/sites-available/student-app
# Then: sudo ln -s /etc/nginx/sites-available/student-app /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name localhost;

    # -----------------------------------------------
    # Option A: Serve React build from Nginx directly
    # Copy build/ output to /var/www/student-app/
    # -----------------------------------------------
    root /var/www/student-app;
    index index.html;

    # React SPA fallback - all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------
    # Reverse Proxy: forward /students API to Spring Boot
    # -----------------------------------------------
    location /students {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # H2 Console (disable in production)
    location /h2-console {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
