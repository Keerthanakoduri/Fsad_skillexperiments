# Server port
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Serve React static build from /static folder inside resources
spring.web.resources.static-locations=classpath:/static/

# Environment variable support (override via env vars at runtime)
# Example: SERVER_PORT=9090 java -jar student-app-deploy-1.0.0.jar
spring.profiles.active=${APP_PROFILE:default}
